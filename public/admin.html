<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.workers.dev; img-src 'self' blob:; base-uri 'self'; form-action 'self'"><meta name="prosolver-api" content="REPLACE_WITH_WORKER_URL"><title>Founder dashboard | ProSolver Hospitals</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
body{font-family:'IBM Plex Sans',system-ui,sans-serif;margin:30px auto;padding:0 20px;max-width:1200px;color:#12304f;background:#f8fbff}h1,h2{color:#0b2441}input,button,select,textarea{font:inherit;padding:10px;border:1px solid #b8c7d7;border-radius:6px}button{background:#1769df;color:white;cursor:pointer}button:disabled{opacity:.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar label{display:flex;flex-direction:column;font-size:12px;gap:4px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}.stats span{background:#eaf2ff;padding:14px;border-radius:8px}.cards{display:grid;gap:12px}.card{background:white;border:1px solid #dbe5ef;border-radius:9px;padding:16px;overflow-wrap:anywhere}.card p{white-space:pre-wrap}.card .meta{font-size:12px;color:#62788c}.card textarea{width:100%;box-sizing:border-box;min-height:75px}.card button{margin:4px}.private{color:#7c3441}#status{min-height:1.4em}
</style></head><body><h1>ProSolver Hospitals · Founder dashboard</h1><p>Private data requires the admin token. It remains in this tab's memory only. Use a trusted device.</p><div class="toolbar"><input id="token" type="password" autocomplete="off" placeholder="Admin token" aria-label="Admin token"><button id="load">Load dashboard</button><button id="clear">Clear session</button></div><div id="status" role="status"></div><div id="stats" class="stats"></div><h2>Submission trends (latest 30 days with activity)</h2><div id="trends" class="stats"></div><h2>Problem submissions</h2><div class="toolbar"><label>Search<input id="q" type="search"></label><label>Verification<select id="statusFilter"><option value="">All</option><option value="verified">Verified</option><option value="pending">Pending</option></select></label><label>Type<select id="typeFilter"><option value="">All</option><option value="typed">Typed</option><option value="voice">Voice</option></select></label><label>Review<select id="reviewFilter"><option value="">All</option><option value="new">New</option><option value="under_review">Under review</option><option value="awaiting_information">Awaiting information</option><option value="accepted">Accepted</option><option value="in_progress">In progress</option><option value="resolved">Resolved</option><option value="archived">Archived</option><option value="rejected">Rejected</option></select></label><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label><button id="filter">Apply filters</button><button id="export">Export aggregate research JSON</button></div><div id="rows" class="cards"></div><script src="./admin.js" defer></script></body></html>
