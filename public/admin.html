<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="prosolver-api" content="REPLACE_WITH_WORKER_URL"><title>Founder dashboard | ProSolver Hospitals</title><style>body{font-family:'IBM Plex Sans',Arial,sans-serif;margin:30px auto;padding:0 20px;max-width:1100px;color:#12304f}input,button{padding:12px;border:1px solid #b8c7d7;border-radius:6px}button{background:#1769df;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #dbe5ef;padding:12px;vertical-align:top;overflow-wrap:anywhere}th{background:#f4f8ff}.scroll{overflow:auto}#status{padding:12px}small{color:#62788c}.stats{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}.stats span{background:#eaf2ff;padding:12px;border-radius:8px}</style></head><body><h1>ProSolver Hospitals | Founder dashboard</h1><p><small>This page is publicly reachable, but data access requires the private admin token. Do not share your token or use a shared computer. The token is held only in this open tab and is not stored.</small></p><p><input id="token" type="password" autocomplete="off" placeholder="Admin token" size="38"> <button id="load">Load private dashboard</button></p><div id="status" role="status"></div><div class="stats" id="stats"></div><div class="scroll"><table><thead><tr><th>Date</th><th>Verified</th><th>Problem</th><th>Daily problems</th><th>Contact</th><th>Audio</th></tr></thead><tbody id="rows"></tbody></table></div><script>
const api=document.querySelector('meta[name="prosolver-api"]')?.content||'';
let secret='';const $=id=>document.getElementById(id);
$('load').onclick=async()=>{secret=$('token').value;$('token').value='';$('status').textContent='Loading…';$('rows').replaceChildren();$('stats').replaceChildren();try{const res=await fetch(api+'/admin/summary',{headers:{Authorization:'Bearer '+secret}});if(!res.ok)throw Error('Access denied or API unavailable');const data=await res.json();const stats=data.totals;for(const [name,value]of Object.entries(stats)){const el=document.createElement('span');el.textContent=name.replaceAll('_',' ')+': '+value;$('stats').append(el);}for(const record of data.submissions){const tr=document.createElement('tr');for(const val of [record.created_at,record.verified_at?'Yes':'Pending',record.problem,record.daily,record.email+' | '+record.phone]){const td=document.createElement('td');td.textContent=val||'—';tr.append(td);}const td=document.createElement('td');if(record.has_audio){const btn=document.createElement('button');btn.textContent='Download';btn.onclick=async()=>{const r=await fetch(api+'/admin/audio/'+record.id,{headers:{Authorization:'Bearer '+secret}});if(!r.ok)return alert('Audio unavailable');const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='prosolver-audio-'+record.id+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);};td.append(btn);}tr.append(td);$('rows').append(tr);}$('status').textContent='Showing latest '+data.submissions.length+' requests. Keep these records confidential.';}catch(e){$('status').textContent=e.message;secret='';}};
</script></body></html>
